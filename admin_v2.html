<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dealer Catalog Admin v2</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0}
header{background:#1f2937;color:#fff;padding:16px;text-align:center}
main{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;padding:16px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:20px}
input,select,button{width:100%;padding:8px;margin:6px 0;box-sizing:border-box}
button{background:#2563eb;color:#fff;border:0;border-radius:6px;cursor:pointer}
button.danger{background:#dc2626}
.brand{border:1px solid #ddd;border-radius:8px;padding:12px;margin:15px 0}
.dealer{background:#f8fafc;border:1px solid #ddd;padding:10px;border-radius:8px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
small{color:#666}
</style>
</head>
<body>
<header><h1>Dealer Catalog Admin v2</h1></header>
<main>

<div class="card">
<h3>Импорт dealers.json</h3>
<input type="file" id="file" accept=".json">
</div>

<div class="card">
<h3>Добавить бренд</h3>
<input id="brand" placeholder="Бренд">
<input id="dealer" placeholder="Первый дилер">
<button onclick="addBrand()">Добавить бренд</button>
</div>

<div class="card">
<h3>Добавить дилера</h3>
<select id="brands"></select>
<input id="newDealer" placeholder="Название дилера">
<button onclick="addDealer()">Добавить дилера</button>
</div>

<div class="card">
<h3>Каталог</h3>
<div id="list"></div>
</div>

<div class="card">
<button onclick="download()">Скачать dealers.json</button>
</div>

</main>

<script>
let data=[];

file.onchange=e=>{
 const r=new FileReader();
 r.onload=()=>{
   data=JSON.parse(r.result);

   data.forEach(b=>{
     b.dealers=(b.dealers||[]).map(d=>{
       if(typeof d==="string"){
         return {name:d,address:"",website:"",map:""};
       }
       return {
         name:d.name||"",
         address:d.address||"",
         website:d.website||"",
         map:d.map||""
       };
     });
   });

   refresh();
 };
 r.readAsText(e.target.files[0]);
};

function refresh(){
 brands.innerHTML="";
 list.innerHTML="";

 data.forEach((brandObj,i)=>{

   brands.innerHTML+=`<option value="${i}">${brandObj.brand}</option>`;

   const wrap=document.createElement("div");
   wrap.className="brand";

   let html=`
   <h2>${brandObj.brand}</h2>
   <button class="danger" onclick="removeBrand(${i})">Удалить бренд</button>
   `;

   brandObj.dealers.forEach((d,j)=>{
      html+=`
      <div class="dealer">
      <small>Название</small>
      <input value="${d.name}" onchange="upd(${i},${j},'name',this.value)">
      <div class="grid">
      <div>
      <small>Адрес</small>
      <input value="${d.address}" onchange="upd(${i},${j},'address',this.value)">
      </div>
      <div>
      <small>Сайт</small>
      <input value="${d.website}" onchange="upd(${i},${j},'website',this.value)">
      </div>
      </div>
      <small>Карта</small>
      <input value="${d.map}" onchange="upd(${i},${j},'map',this.value)">
      <button class="danger" onclick="removeDealer(${i},${j})">Удалить дилера</button>
      </div>`;
   });

   wrap.innerHTML=html;
   list.appendChild(wrap);

 });

}

function upd(i,j,key,val){
 data[i].dealers[j][key]=val;
}

function addBrand(){
 if(!brand.value||!dealer.value)return;
 data.push({
   brand:brand.value,
   dealers:[{
      name:dealer.value,
      address:"",
      website:"",
      map:""
   }]
 });
 brand.value="";
 dealer.value="";
 refresh();
}

function addDealer(){
 if(!newDealer.value)return;
 data[brands.value].dealers.push({
   name:newDealer.value,
   address:"",
   website:"",
   map:""
 });
 newDealer.value="";
 refresh();
}

function removeBrand(i){
 if(confirm("Удалить бренд?")){
   data.splice(i,1);
   refresh();
 }
}

function removeDealer(i,j){
 if(confirm("Удалить дилера?")){
   data[i].dealers.splice(j,1);
   refresh();
 }
}

function download(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="dealers.json";
 a.click();
 URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
